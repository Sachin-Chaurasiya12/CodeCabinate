version: "3.9"

networks:
  codesparrow-net:
    driver: bridge

volumes:
  auth-target:
  dashboard-target:
  profile-target:
  inventory-target:
  connect-target:
  mysql_data:

services:

  mysql:
    image: mysql:8.0
    container_name: codesparrow-mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}

    ports:
      - "${MYSQL_PORT}:3306"

    volumes:
      - mysql_data:/var/lib/mysql
      - ./database.sql:/docker-entrypoint-initdb.d/database.sql

    networks:
      - codesparrow-net

  auth-service:
    build:
      context: ./backend/AuthService
      dockerfile: Dockerfile

    container_name: auth-service
    restart: unless-stopped

    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8081

      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      JWT_SECRET: ${JWT_SECRET}

    ports:
      - "8081:8081"

    volumes:
      - ./backend/AuthService:/app
      - auth-target:/app/target

    extra_hosts:
      - "host.docker.internal:host-gateway"

    depends_on:
      - mysql

    networks:
      - codesparrow-net

  dashboard-service:
    build:
      context: ./backend/DashboardService
      dockerfile: Dockerfile

    container_name: dashboard-service
    restart: unless-stopped

    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8082

      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      JWT_SECRET: ${JWT_SECRET}

    ports:
      - "8082:8082"

    volumes:
      - ./backend/DashboardService:/app
      - dashboard-target:/app/target

    extra_hosts:
      - "host.docker.internal:host-gateway"

    depends_on:
      - mysql

    networks:
      - codesparrow-net

  profile-service:
    build:
      context: ./backend/ProfileService
      dockerfile: Dockerfile

    container_name: profile-service
    restart: unless-stopped

    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8083

      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      JWT_SECRET: ${JWT_SECRET}

    ports:
      - "8083:8083"

    volumes:
      - ./backend/ProfileService:/app
      - profile-target:/app/target

    extra_hosts:
      - "host.docker.internal:host-gateway"

    depends_on:
      - mysql

    networks:
      - codesparrow-net

  inventory-service:
    build:
      context: ./backend/InventoryService
      dockerfile: Dockerfile

    container_name: inventory-service
    restart: unless-stopped

    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8084

      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      JWT_SECRET: ${JWT_SECRET}

    ports:
      - "8084:8084"

    volumes:
      - ./backend/InventoryService:/app
      - inventory-target:/app/target

    extra_hosts:
      - "host.docker.internal:host-gateway"

    depends_on:
      - mysql

    networks:
      - codesparrow-net
      
  connect-service:
    build:
      context: ./backend/ConnectService
      dockerfile: Dockerfile

    container_name: connect-service
    restart: unless-stopped

    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8085

      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}

      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}

      JWT_SECRET: ${JWT_SECRET}
      STOMP_WEB_ALLOWED_ORIGINS: ${STOMP_WEB_ALLOWED_ORIGINS}

    ports:
      - "8085:8085"
      - "5005:5005"

    command:
      - "spring-boot:run"
      - "-Dspring-boot.run.jvmArguments=-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005"

    volumes:
      - ./backend/ConnectService:/app
      - connect-target:/app/target

    extra_hosts:
      - "host.docker.internal:host-gateway"

    depends_on:
      - mysql

    networks:
      - codesparrow-net
      
  service-registry:
    build:
      context: ./backend/Service-registry
      dockerfile: Dockerfile

    container_name: service-registry

    environment:
      SPRING_PROFILES_ACTIVE: docker

    ports:
      - "8761:8761"

    networks:
      - codesparrow-net


  frontend:
    build:
      context: ./Core/Core.Fontend/CodeSparrow-Core
      dockerfile: Dockerfile

    container_name: codesparrow-frontend
    restart: unless-stopped

    environment:
      CHOKIDAR_USEPOLLING: "true"
      HOST: "0.0.0.0"

    ports:
      - "3000:3000"

    volumes:
      - ./Core/Core.Fontend/CodeSparrow-Core:/app
      - /app/node_modules

    networks:
      - codesparrow-net

  nginx:
    image: nginx:alpine

    container_name: codesparrow-nginx
    restart: unless-stopped

    ports:
      - "80:80"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

    depends_on:
      - frontend
      - auth-service
      - dashboard-service
      - profile-service
      - inventory-service
      - connect-service

    networks:
      - codesparrow-net